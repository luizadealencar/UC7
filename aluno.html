<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas notas - Gavetas</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..900&display=swap" rel="stylesheet">
</head>

<body>
  <header class="header">
    <nav class="navbar">
      <a class="logo" href="aluno.html" aria-label="Ir para minhas notas">
        <img src="img/logo.png" alt="Logo">
        <p>Gavetas</p>
      </a>
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-links">
        <span class="menu-icon" aria-hidden="true"></span>
      </button>
      <ul id="nav-links" class="nav-links">
        <li><a href="aluno.html">Minhas notas</a></li>
        <li><button id="logout-button" class="logout-button" type="button">Sair</button></li>
      </ul>
    </nav>
  </header>
  <main class="container student-area">
    <h1>Minhas notas</h1>
    <p id="student-grade-message" aria-live="polite"></p>
    <div class="grade-table-wrapper">
      <table id="student-grade-table" hidden>
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="js/script.js"></script>

</html>
